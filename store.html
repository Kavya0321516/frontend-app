<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store - ShopWave</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="store.css" />
</head>
<body>
  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <!-- Brand Logo -->
      <a href="store.html" class="brand-logo">
        <span class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </span>
        <span>ShopWave</span>
      </a>

      <!-- Navigation Links -->
      <nav>
        <ul class="nav-links">
          <li>
            <a href="store.html" class="nav-link active">
              <span>Store</span>
            </a>
          </li>
          <li>
            <a href="cart.html" class="nav-link cart-nav-link" id="navCartLink">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
              </svg>
              <span>Cart</span>
              <span class="cart-badge-count" style="display: none;">0</span>
            </a>
          </li>
          <li>
            <span class="user-badge" id="userGreeting">Hi, Shopper!</span>
          </li>
          <li>
            <button class="logout-btn" title="Sign out of your account">Logout</button>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Hero Section with Search -->
  <section class="hero">
    <div class="hero-content">
      <span class="hero-badge">Curated Collection</span>
      <h1 class="hero-title">Explore Trending Essentials</h1>
      <p class="hero-subtitle">High-quality lifestyle, tech, and fashion picks crafted for modern living.</p>

      <!-- Search Input -->
      <div class="search-wrapper">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Search products by name or keywords..." 
          autocomplete="off"
        />
      </div>
    </div>
  </section>

  <!-- Main Store Section -->
  <main class="store-container">
    <!-- Category Filter Bar -->
    <div class="filter-bar">
      <div class="category-filters" id="categoryFilters">
        <button class="category-pill active" data-category="All">All Items</button>
        <button class="category-pill" data-category="Electronics">Electronics</button>
        <button class="category-pill" data-category="Fashion">Fashion</button>
        <button class="category-pill" data-category="Home & Living">Home & Living</button>
        <button class="category-pill" data-category="Accessories">Accessories</button>
      </div>
      <div class="results-count" id="resultsCount">Showing all products</div>
    </div>

    <!-- Product Grid Container -->
    <div class="product-grid" id="productGrid">
      <!-- Populated dynamically via store.js -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>&copy; 2026 ShopWave Online Store. All demo products and images for preview purposes.</p>
  </footer>

  <!-- Scripts -->
  <script src="products.js"></script>
  <script src="store.js"></script>
</body>
</html>
