<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - ShopWave</title>
  <!-- Link to stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">
    <!-- Sign In Card (Keeps the original card design) -->
    <main class="card">
      <!-- Card Header -->
      <header class="card-header">
        <div class="brand-badge">
          <!-- Shopping bag & user icon -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
        <h1 class="card-title">Welcome to ShopWave</h1>
        <p class="card-subtitle">Sign in to your account to start shopping.</p>
      </header>

      <!-- Global Alert Box -->
      <div id="alertBox" class="alert hidden" role="alert" aria-live="polite"></div>

      <!-- Sign In Form -->
      <form id="signInForm" novalidate>
        <!-- Email Field -->
        <div class="form-group" id="emailGroup">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="e.g. demo@example.com"
              autocomplete="email"
            />
          </div>
          <small class="error-message" id="emailError"></small>
        </div>

        <!-- Password Field -->
        <div class="form-group" id="passwordGroup">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Enter your password"
              autocomplete="current-password"
            />
            <!-- Show/Hide Password Toggle Button -->
            <button 
              type="button" 
              id="togglePasswordBtn" 
              class="toggle-password-btn" 
              aria-label="Toggle password visibility"
              title="Toggle password visibility"
            >
              <svg id="eyeIcon" class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eyeSlashIcon" class="icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <small class="error-message" id="passwordError"></small>
        </div>

        <!-- Submit Sign In Button -->
        <button type="submit" id="submitBtn" class="submit-btn">
          <span>Sign In</span>
        </button>

        <!-- Quick Demo Fill Helper -->
        <button type="button" id="demoFillBtn" class="demo-btn" title="Click to fill test credentials">
          ⚡ Quick Demo Login
        </button>
      </form>

      <!-- Footer: Link to Register a new account -->
      <footer class="card-footer">
        <p>Don't have an account? <a href="register.html" class="link">Register here</a></p>
        <p style="margin-top: 8px;">
          <a href="store.html" class="guest-link">Continue as Guest &rarr;</a>
        </p>
      </footer>
    </main>
  </div>

  <script src="products.js"></script>
  <script src="script.js"></script>
</body>
</html>
